# Builds the Windows installer (2.26.0).
#  - Push a tag vX.Y.Z (matching VERSION)  -> builds Setup.exe and publishes a GitHub Release
#    with it, its SHA-256 and that version's CHANGELOG section as the notes.
#  - Actions -> Release -> Run workflow   -> test build only: Setup.exe as a downloadable
#    artifact of the run (nothing is published).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.10"   # installed by Setup when the PC has no Python 3.12-3.14
  WINSW_VERSION: "v2.12.0"    # Windows service wrapper (https://github.com/winsw/winsw)

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags too: the release notes cover every version since the previous release

      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $($env:GITHUB_REF_NAME) doesn't match VERSION ($v). Bump VERSION, commit, then tag v$v."
          }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Check the Python code compiles
        shell: pwsh
        run: python -m compileall -q backend Tools run.py

      - name: Translations
        shell: pwsh
        run: |
          python -m pip install --quiet fastapi loguru
          python -m Tools.i18n check

      - name: Fetch WinSW and the Python installer's checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/windows/build | Out-Null
          Invoke-WebRequest "https://github.com/winsw/winsw/releases/download/$($env:WINSW_VERSION)/WinSW-x64.exe" `
            -OutFile installer/windows/build/PMVNexusService.exe
          # Setup downloads Python itself (only when needed); pin the file it will accept.
          $py = "https://www.python.org/ftp/python/$($env:PYTHON_VERSION)/python-$($env:PYTHON_VERSION)-amd64.exe"
          Invoke-WebRequest $py -OutFile "$env:RUNNER_TEMP/python.exe"
          $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP/python.exe"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
            throw "The Python installer isn't signed by the Python Software Foundation ($($sig.Status))"
          }
          $hash = (Get-FileHash "$env:RUNNER_TEMP/python.exe" -Algorithm SHA256).Hash.ToLower()
          "PY_SHA256=$hash" >> $env:GITHUB_ENV

      - name: Face models (3.12.0, shipped in Setup.exe; checked by SHA-256)
        shell: pwsh
        run: |
          python -m Tools.get_face_models
          if ($LASTEXITCODE -ne 0) { throw "The face models couldn't be downloaded or didn't match their SHA-256" }

      - name: Build PMVNexus.exe (the shortcuts' program)
        shell: pwsh
        run: ./installer/windows/build_launcher.ps1 -Version $env:APP_VERSION

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" "/DPythonVersion=$env:PYTHON_VERSION" "/DPythonSha256=$env:PY_SHA256" `
            installer/windows/PMVNexus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $exe = "installer/windows/build/out/PMV-Nexus-Setup-$env:APP_VERSION.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $exe -Leaf) |
            Out-File -Encoding ascii "$exe.sha256"

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # 3.5.0: every CHANGELOG section newer than the previous release tag (e.g. v3.5.0 after v3.4.1 also
          # gets 3.4.2, which was never released on its own), newest first; one version = just its section.
          $text = Get-Content CHANGELOG.md -Raw
          $current = [version]$env:APP_VERSION
          $previous = [version]"0.0.0"
          foreach ($t in (git tag --list "v*.*.*")) {
            try { $v = [version]$t.Substring(1) } catch { continue }
            if ($v -lt $current -and $v -gt $previous) { $previous = $v }
          }
          $sections = [regex]::Matches($text, "(?ms)^## \[(\d+\.\d+\.\d+)\]([^\n]*)\n(.*?)(?=^## \[|\z)") | Where-Object {
            $v = [version]$_.Groups[1].Value; $v -le $current -and $v -gt $previous }
          if (-not $sections) { $notes = "See CHANGELOG.md." }
          elseif (@($sections).Count -eq 1) { $notes = $sections[0].Groups[3].Value.Trim() }
          else {
            $notes = "Everything since $previous`:`n`n" + (($sections | ForEach-Object {
              "## $($_.Groups[1].Value)$($_.Groups[2].Value)`n`n$($_.Groups[3].Value.Trim())" }) -join "`n`n")
          }
          Write-Host "Release notes: versions after $previous up to $current"
          $notes += "`n`n---`n**Windows:** download ``PMV-Nexus-Setup-$env:APP_VERSION.exe`` and run it. " +
                    "Windows may say it protected your PC (the installer isn't code-signed): **More info -> Run anyway**.`n" +
                    "**Linux / macOS:** download the source code below and run ``./install.sh``."
          Set-Content -Encoding utf8 "$env:RUNNER_TEMP/notes.md" $notes

      - uses: actions/upload-artifact@v4
        with:
          name: PMV-Nexus-Setup-${{ env.APP_VERSION }}
          path: installer/windows/build/out/*
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: PMV Nexus ${{ env.APP_VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            installer/windows/build/out/PMV-Nexus-Setup-${{ env.APP_VERSION }}.exe
            installer/windows/build/out/PMV-Nexus-Setup-${{ env.APP_VERSION }}.exe.sha256

      # 3.5.0: the Discord server's locked voice channel shows the latest version ("📦 Latest: v3.5.0").
      # Needs the repository secret DISCORD_BOT_TOKEN (a bot with "Manage Channels" on that channel) and the
      # repository variable DISCORD_VERSION_CHANNEL_ID; skipped when they're not set. A Discord problem never
      # fails the release (Discord allows 2 renames per channel per 10 minutes).
      - name: Show the version on Discord
        if: github.ref_type == 'tag'
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_VERSION_CHANNEL_ID: ${{ vars.DISCORD_VERSION_CHANNEL_ID }}
        run: |
          if (-not $env:DISCORD_BOT_TOKEN -or -not $env:DISCORD_VERSION_CHANNEL_ID) {
            Write-Host "Discord isn't set up (DISCORD_BOT_TOKEN / DISCORD_VERSION_CHANNEL_ID); skipped."
            exit 0
          }
          $body = @{ name = "📦 Latest: v$env:APP_VERSION" } | ConvertTo-Json -Compress
          # Discord refuses bot requests without a "DiscordBot (url, version)" User-Agent (error 40333).
          Invoke-RestMethod -Method Patch -Uri "https://discord.com/api/v10/channels/$env:DISCORD_VERSION_CHANNEL_ID" `
            -UserAgent "DiscordBot (https://github.com/$env:GITHUB_REPOSITORY, $env:APP_VERSION)" `
            -Headers @{ Authorization = "Bot $env:DISCORD_BOT_TOKEN"; "X-Audit-Log-Reason" = "Release v$env:APP_VERSION" } `
            -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body)) | Out-Null
          Write-Host "Discord channel renamed to: 📦 Latest: v$env:APP_VERSION"
